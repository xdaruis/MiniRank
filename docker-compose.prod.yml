services:
  seed:
    build:
      context: .
      target: prod
    image: minirank:prod
    container_name: minirank-seed
    command: ["sh", "-c", "[ -f /var/www/data/minirank.db ] || php database/seed.php"]
    environment:
      DATABASE_PATH: /var/www/data/minirank.db
    volumes:
      - app_code:/var/www
      - db_data:/var/www/data
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: .
      target: prod
    image: minirank:prod
    container_name: minirank-app
    environment:
      DATABASE_PATH: /var/www/data/minirank.db
    volumes:
      - app_code:/var/www
      - db_data:/var/www/data
    networks:
      - minirank
    expose:
      - "9000"

  web:
    image: nginx:alpine
    container_name: minirank-web
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_code:/var/www:ro
    networks:
      - minirank
    depends_on:
      - app

volumes:
  app_code:
    name: minirank_prod_app_code
  db_data:
    name: minirank_prod_db_data

networks:
  minirank: